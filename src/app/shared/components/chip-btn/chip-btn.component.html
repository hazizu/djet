<div class="chip-btn" (click)="clickedBtn()" [ngClass]="{chip_btn_clicked_style:isActive}">
    <div *ngIf="chipsData?.icon1" class="chip-btn-content-default">
       <img [src]="chipsData?.icon1">
    </div>
    <div *ngIf="chipsData?.icon2" class="chip-btn-content-cliked">
        <img [src]="chipsData?.icon2">
    </div>
    <span [ngClass]="{'chip_lib_style':!chipsData?.icon1 || !chipsData?.icon2}" class="chip-lib">{{chipsData?.name}}</span>
</div>
