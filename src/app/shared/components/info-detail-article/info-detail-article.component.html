<div class="info-conainer">
    <div class="haert-container" (click)="liked()">
        <div class="heart" *ngIf="isLiked">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                <path
                    d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z" />
            </svg>
        </div>
        <div class="outheart" *ngIf="!isLiked">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
            </svg>
        </div>
    </div>
    <div class="article-name"><span>{{article?.name}}</span></div>
    <div class="article-quantity" *ngIf=" article && article?.quantity">
        <span>
            {{ article.quantity }}
            {{ article.quantity > 1 ? 'articles restants' : 'article restant' }}
        </span>
    </div>
    <div><span class="available-text" *ngIf="article?.quantity == 0">EN RUPTURE DE STOCK</span></div>
    <div *ngIf=" article && article?.quantity" class="livraison-text"><span>Livraison gratuite !</span></div>
    <div class="article-price"><span>{{article?.price | number:'1.0-0'}} FCFA</span></div>
    <div *ngIf="article?.oldPrice" class="article-old-price"><span>{{article?.oldPrice}} FCFA</span></div>
    <div class="note-container">
        <span>Note</span>
        <div class="etoiles">
            <img src="./../../../../assets/SVG/star.svg" alt="djet website star">
            <img src="./../../../../assets/SVG/star.svg" alt="djet website star">
            <img src="./../../../../assets/SVG/star.svg" alt="djet website star">
            <img src="./../../../../assets/SVG/star.svg" alt="djet website star">
            <img src="./../../../../assets/SVG/star_half.svg" alt="djet website star">
        </div>
        <span class="etoiles-note">{{article?.note}}</span>
        <span class="link-comment">Voir les avis (10 avis)</span>
    </div>
    <app-button [isDisabled]="article?.quantity == 0" (clicked)="addToPanier()" label="Ajouter au panier"></app-button>
</div>
