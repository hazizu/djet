<div class="product-main">
    <div class="title-content">
        <span class="title">Les offres techs de la semaine</span>
        <div class="action-plus">
            <span>Voir tout</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
              </svg>
              
        </div>
    </div>
    <div class="main">

        <div class="list" *ngFor="let product of productData">
            <app-product-card-item [productData]="product"></app-product-card-item>
        </div>

    </div>
</div>
