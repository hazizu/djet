<div class="container-main">
    <div class="foot_bloc1">
        <div class="logo" (click)="goToHome()">
            <img src="./../../../../assets/SVG/Logo-Djet.svg"/>
        </div>
        <div class="form-bloc">
            <div class="form-msg">
                <span class="form-msg-title">Nouveau sur Djet Technologie ?</span>
                <span class="form-msg-content">Inscrivez-vous à nos communications pour recevoir nos meilleurs affres!</span>
            </div>
            <form [formGroup]="newLesterForm">
            <div class="form-content">
                <div class="input-content">
                <app-input [isStyle]="true" controlName="email" placeholderText="Saisissez votre adresse email" [styles]="{border:'1px solid #FFF'}" [redBorder]="newLesterForm.get('email')?.invalid && invalidError">
                    <img src="./../../../../assets/SVG/mail.svg"/>
                </app-input>
                <!-- message d'envois avec succès -->
                <span *ngIf="!showButton" class="succss_lib_style"> merci !! Votre email a été envoyé.</span>
           
                </div>
                <div class="input-content-button" *ngIf="showButton">
                <app-button (clicked)="sendMail()" label="S'inscrire" [styles]="{height:'3rem', padding:'0 1.5rem', display:'flex', flexDirection:'column', justifyContent:'center', border:'1px solid transparent', marginLeft:'1rem'}"></app-button>
                </div>
            </div>
        </form>
        </div>

    </div>
    <div class="foot_bloc2">
        <div class="foot_bloc2-content">
        <div class="aide-content">
        <div class="ai">
            <span class="aide-content-title">Besoin d'aide</span>
            <!-- <span>Aides et FAQ</span> -->
            <!-- <span>Discuter avec nous</span> -->
            <span>infos@djettechnologie.com</span>
            <span>+225 07 58 79 85 24</span> 
        </div>
        </div>
        <div class="categorie-content">
            <div class="ai">
            <span class="aide-content-title">Catégories</span>
            <div class="categorie-bloc-list">
                <div class="categorie-bloc-item" *ngFor="let categorie of mainNews">
                    <span (click)="goToCategorie(categorie)" class="categorie-bloc-item-title">{{categorie.name}}</span>
            </div>
           
        </div>
        </div>
 
    </div>
           <div class="social-media-content">
            <div class="ai">
            <span class="aide-content-title">Retrouvez-nous sur nos réseaux sociaux</span>
            <div class="social-media-content-img">
            <img src="./../../../../assets/SVG/facebook.svg" (click)="goToFacebook()">
            <img src="./../../../../assets/SVG/insta.svg" (click)="goToInsta()">
            <img src="./../../../../assets/SVG/tiktok.svg" (click)="goToTiktok()">

        </div>
        </div>
